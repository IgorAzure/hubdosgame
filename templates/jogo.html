{% extends 'base.html' %}

{% block content %}
<div class="detalhes-jogo">
    <div class="header-jogo">
        <h1> {{ jogo.titulo }} </h1>

        <div class="header-acoes">
            <span class="badge {{jogo.status.lower()}}">{{jogo.status}}</span>

            <details class="dropdown">
                <summary class="pontinhos">⋮</summary>

                <ul class="menu-opcoes">
                    <li>
                        <a href="/mudar_status/{{jogo.id}}/Backlog">
                            Mover para o backlog
                        </a>
                    </li>
                    <li>
                        <a href="/mudar_status/{{jogo.id}}/Zerado">
                            Mover para zerados
                        </a>
                    </li>

                    <hr>

                    <li>
                        <a href="/deletar/{{ jogo.id }}">
                            Excluir o jogo
                        </a>
                    </li>
                </ul>
            </details>
        </div>

    </div>

    <div class="info">
        <p><strong>Genero: </strong>{{jogo.genero}}</p>
    </div>

    <a href="javascript:history.back()" class="btn-voltar">Voltar</a>
</div>


{% endblock %}
